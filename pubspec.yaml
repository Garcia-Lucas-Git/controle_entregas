name: controle_entregas
description: "DeliveryFlow — Academic Flutter project demonstrating OCR, local database, geolocation, route planning, and workflow automation for operational mobile systems."
publish_to: 'none'

version: 1.0.0+2002

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5

  # Navigation
  go_router: ^14.6.2

  # Database
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.4
  path: ^1.9.0

  # OCR
  google_mlkit_text_recognition: ^0.13.1

  # Camera
  image_picker: ^1.1.2

  # Maps & sharing
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # iFood WebView
  webview_flutter: ^4.10.0

  # WakeLock
  wakelock_plus: ^1.2.10

  # Permissions
  permission_handler: ^11.3.1

  # Serialization & models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Localization
  intl: ^0.19.0

  # Utils
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  riverpod_generator: ^2.6.1
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logoapp/entrega.png"
  adaptive_icon_background: "#1A0E0A"
  adaptive_icon_foreground: "assets/logoapp/entrega.png"

flutter:
  uses-material-design: true
  generate: true
